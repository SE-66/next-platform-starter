<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ERXL — Financial Model Error Finder</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:0 auto;padding:48px 20px 80px}
    h1{font-size:44px;letter-spacing:-1.6px;margin:0}.sub{color:#4b5563;font-size:18px;line-height:1.6;margin:12px 0 30px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(15,23,42,.06)}
    .drop{border:2px dashed #cbd5e1;border-radius:14px;padding:32px;text-align:center;background:#fafcff}
    button{background:#111827;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5}.muted{color:#64748b;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
    .stat{background:#f8fafc;border-radius:12px;padding:16px}.stat b{display:block;font-size:24px}.finding{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-top:10px}
    .sev{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.critical{color:#b91c1c}.high{color:#c2410c}.medium{color:#a16207}.low{color:#475569}
    code{background:#f1f5f9;padding:2px 6px;border-radius:6px}#results{margin-top:24px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}h1{font-size:36px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ERXL</h1>
    <p class="sub">Upload a financial Excel model. ERXL inspects its formulas and dependency structure to surface suspicious logic before it reaches a decision.</p>
    <section class="card">
      <form id="form">
        <div class="drop">
          <input id="file" name="file" type="file" accept=".xlsx" required />
          <p class="muted">MVP: .xlsx only, max 12 MB. The Cloudflare Worker analyzes the workbook in memory.</p>
          <button id="submit" type="submit">Analyze workbook</button>
        </div>
      </form>
      <div id="status" class="muted" style="margin-top:14px"></div>
      <div id="results"></div>
    </section>
  </main>
<script>
const form=document.getElementById("form");
const statusEl=document.getElementById("status");
const results=document.getElementById("results");
const submit=document.getElementById("submit");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const file=document.getElementById("file").files[0];
  if(!file)return;
  submit.disabled=true; statusEl.textContent="Analyzing…"; results.innerHTML="";
  try{
    const fd=new FormData(); fd.append("file",file);
    const r=await fetch("/api/analyze",{method:"POST",body:fd});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Analysis failed");
    const s=data.summary;
    results.innerHTML=`
      <div class="stats">
        <div class="stat"><b>${s.sheets}</b><span class="muted">Sheets</span></div>
        <div class="stat"><b>${s.populatedCells}</b><span class="muted">Populated cells</span></div>
        <div class="stat"><b>${s.formulaCells}</b><span class="muted">Formula cells</span></div>
        <div class="stat"><b>${s.findings}</b><span class="muted">Findings</span></div>
      </div>
      <p class="muted">Run <code>${esc(data.runId)}</code> · persistence: ${esc(data.persistence)}</p>
      ${data.findings.map(f=>`
        <article class="finding">
          <div class="sev ${esc(f.severity)}">${esc(f.severity)}</div>
          <h3>${esc(f.title)}</h3>
          <p>${esc(f.details)}</p>
          <p class="muted">${f.sheet?esc(f.sheet):""}${f.cell?" · "+esc(f.cell):""} · ${esc(f.code)}</p>
        </article>`).join("") || "<p>No heuristic issues found. This does not prove the model is correct.</p>"}
    `;
    statusEl.textContent="Analysis complete.";
  }catch(err){
    statusEl.textContent=err.message||String(err);
  }finally{submit.disabled=false;}
});
</script>
</body>
</html>

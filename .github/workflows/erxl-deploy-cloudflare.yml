name: Deploy ERXL to Cloudflare

on:
  push:
    branches: [ERXL]
    paths:
      - "ERXL/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/erxl-deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: erxl-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp build provenance
        shell: bash
        run: |
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > ERXL/src/build-info.ts <<EOF
          export const BUILD_INFO = {
            version: "0.4.4",
            commit: "${GITHUB_SHA}",
            builtAt: "${BUILD_TIME}"
          } as const;
          EOF

      - name: Validate ERXL
        run: npm run build

      - name: Deploy ERXL Worker
        run: npx wrangler@4.147.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

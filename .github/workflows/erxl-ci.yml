name: ERXL CI

on:
  push:
    branches: [ERXL]
    paths:
      - "ERXL/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/erxl-ci.yml"
  pull_request:
    paths:
      - "ERXL/**"
      - "package.json"
      - "wrangler.jsonc"

jobs:
  erxl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ERXL tests
        run: npm run build
      - name: Validate Cloudflare bundle
        run: npx wrangler@4.147.0 deploy --dry-run --outdir .wrangler-dry-run
